<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Browse the photos and video you saved on X — a fast, horizontal media library that lives entirely in your browser." />
<title>Browse · X Bookmarks</title>

<link rel="stylesheet" href="../shared/m3e/fonts.css" />

<link rel="stylesheet" href="../shared/m3e/tokens.css" />
<link rel="stylesheet" href="../shared/m3e/components.css" />
<link rel="stylesheet" href="layout.css" />
</head>

<body>

<a class="m3e-skip-link m3e-label-large" href="#feed">Skip to media</a>

<!-- ==========================================================================
     APP SHELL

     A media browser, not a document reader. The organising idea is that the
     media is the interface: nothing but media occupies the centre of the
     screen, and every piece of chrome either floats over it or sits at an
     edge where it can be ignored.

     Three window classes, one DOM:
       compact   (<600)   full-bleed feed + floating bottom bar
       medium    (600+)   navigation rail + feed
       expanded  (1200+)  navigation rail + feed + persistent inspector
     ========================================================================== -->
<div class="shell">

  <!-- ---------------------------------------------------------------------
       Navigation rail — medium and up.
       Five destinations, each a different way INTO the media, never a
       different kind of object. Icons carry a filled indicator pill when
       selected (M3E's active-indicator), so selection survives greyscale.
       --------------------------------------------------------------------- -->
  <nav class="shell__rail m3e-rail" id="rail" aria-label="Primary">
    <div class="rail__brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M4 5h7v6H4V5Zm9 0h7v10h-7V5ZM4 13h7v6H4v-6Zm9 4h7v2h-7v-2Z"/>
      </svg>
    </div>

    <button class="m3e-fab m3e-fab--primary m3e-state rail__fab" id="railFab"
      aria-label="Add bookmarks" data-tooltip="Import">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M11 13.2V3h2v10.2l3.6-3.6L18 11l-6 6-6-6 1.4-1.4L11 13.2ZM5 19h14v2H5v-2Z"/>
      </svg>
    </button>

    <div class="rail__items" id="railItems" role="tablist" aria-orientation="vertical"></div>

    <div class="rail__foot">
      <button class="m3e-icon-button m3e-state" id="railTheme" aria-label="Switch color scheme" data-tooltip="Color scheme">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>
        </svg>
      </button>
      <button class="m3e-icon-button m3e-state" id="railSettings" aria-label="Open settings" data-tooltip="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.1.1-1.4-.1-1.4 2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.4-1.4L14.2 2H9.8l-.4 2.2A7.6 7.6 0 0 0 7 5.6l-2.4-1-2 3.5 2 1.5-.1 1.4.1 1.4-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.4 1.4l.4 2.2h4.4l.4-2.2a7.6 7.6 0 0 0 2.4-1.4l2.4 1 2-3.5-2-1.5Z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ---------------------------------------------------------------------
       Main pane
       --------------------------------------------------------------------- -->
  <div class="shell__main">

    <!-- App bar. Collapses to a single row of glass over the media on scroll;
         it never occupies fixed vertical space that the feed could use. -->
    <header class="m3e-app-bar app-bar" id="appBar">
      <div class="app-bar__identity">
        <span class="app-bar__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M4 5h7v6H4V5Zm9 0h7v10h-7V5ZM4 13h7v6H4v-6Zm9 4h7v2h-7v-2Z"/>
          </svg>
        </span>
        <h1 class="m3e-title-large m3e-title-large--emphasized app-bar__title" id="paneTitle">Browse</h1>
      </div>

      <div class="m3e-search app-bar__search" role="search">
        <svg class="m3e-search__icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M20.5 19.1 16.9 15.5A7 7 0 1 0 15.5 16.9l3.6 3.6 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 5.5 5.5A5.5 5.5 0 0 1 5 10.5Z"/>
        </svg>
        <input class="m3e-search__input" id="search" type="search" enterkeyhint="search"
          placeholder="Search posts and authors"
          aria-label="Search your media" aria-describedby="searchHint"
          autocomplete="off" spellcheck="false" />
        <span id="searchHint" class="m3e-visually-hidden">
          Results update as you type. Press slash to return here.
        </span>
        <button class="m3e-icon-button m3e-icon-button--s m3e-state" id="searchClear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9Z"/>
          </svg>
        </button>
        <kbd class="m3e-search__kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="app-bar__actions">
        <!-- View switch: the single most consequential control on the page,
             so it is a permanent segmented button rather than a menu item. -->
        <div class="m3e-segmented app-bar__view" id="viewSeg" role="group" aria-label="Layout">
          <button class="m3e-segmented__item m3e-state" data-view="rails" aria-pressed="true" title="Rails — browse by collection">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
              <path d="M3 5h8v6H3V5Zm10 0h8v6h-8V5ZM3 13h8v6H3v-6Zm10 0h8v6h-8v-6Z"/>
            </svg>
            <span class="m3e-visually-hidden">Rails view</span>
          </button>
          <button class="m3e-segmented__item m3e-state" data-view="grid" aria-pressed="false" title="Grid — everything at once">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
              <path d="M3 3h5v7H3V3Zm7 0h5v5h-5V3Zm7 0h4v9h-4V3ZM3 12h5v9H3v-9Zm7 7h5v2h-5v-2Zm0-9h5v7h-5v-7Zm7 4h4v7h-4v-7Z"/>
            </svg>
            <span class="m3e-visually-hidden">Grid view</span>
          </button>
          <button class="m3e-segmented__item m3e-state" data-view="theater" aria-pressed="false" title="Theater — one at a time">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
              <path d="M2 7h3v10H2V7Zm4.5 0H17.5v10H6.5V7ZM19 7h3v10h-3V7Z"/>
            </svg>
            <span class="m3e-visually-hidden">Theater view</span>
          </button>
        </div>

        <button class="m3e-icon-button m3e-state app-bar__overflow" id="appBarSettings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.1.1-1.4-.1-1.4 2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.4-1.4L14.2 2H9.8l-.4 2.2A7.6 7.6 0 0 0 7 5.6l-2.4-1-2 3.5 2 1.5-.1 1.4.1 1.4-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.4 1.4l.4 2.2h4.4l.4-2.2a7.6 7.6 0 0 0 2.4-1.4l2.4 1 2-3.5-2-1.5Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content region ------------------------------------------ -->
    <div class="pane" id="pane">

      <!-- Capture banner: only ever shown when the dashboard is running
           inside the extension and there is something to report. -->
      <section class="capture" id="captureBanner" hidden aria-live="polite">
        <span class="capture__dot" id="captureDot" aria-hidden="true"></span>
        <div class="capture__text">
          <p class="capture__title m3e-title-small" id="captureTitle"></p>
          <p class="capture__detail m3e-body-small" id="captureDetail"></p>
        </div>
        <div class="capture__actions" id="captureActions"></div>
      </section>

      <!-- Filter bar: a horizontally scrolling chip set. Selected chips change
           SHAPE as well as colour, so state survives greyscale. -->
      <div class="filterbar" id="filterBar">
        <div class="filterbar__scroll" role="group" aria-label="Filters">
          <button class="m3e-chip m3e-state filterbar__chip" id="chipVideo" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M4 5h11a1 1 0 0 1 1 1v3.4l4.3-2.5a.8.8 0 0 1 1.2.7v8.8a.8.8 0 0 1-1.2.7L16 14.6V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>
            </svg>
            <span>Video</span>
          </button>
          <button class="m3e-chip m3e-state filterbar__chip" id="chipPhotos" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 13h14v-2.2l-3.5-3.5-2.6 2.6-3.4-4.2L5 15.4V17Zm10.5-6a1.8 1.8 0 1 0-1.8-1.8A1.8 1.8 0 0 0 15.5 11Z"/>
            </svg>
            <span>Photos</span>
          </button>
          <button class="m3e-chip m3e-state filterbar__chip" id="chipGif" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7.4 5.2H8.6a1.4 1.4 0 0 0-1.4 1.4v1a1.4 1.4 0 0 0 1.4 1.4h1.8v-1.6H9.4M12.6 9.8v4.6M15 14.4V9.8h2.6M15 12.3h2.2"/>
            </svg>
            <span>GIF</span>
          </button>

          <span class="filterbar__divider" aria-hidden="true"></span>

          <button class="m3e-chip m3e-state filterbar__chip" id="chipAuthor" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4 0-7 2-7 4.6V21h14v-2.4C19 16 16 14 12 14Z"/>
            </svg>
            <span id="chipAuthorLabel">All authors</span>
          </button>
          <button class="m3e-chip m3e-state filterbar__chip" id="chipRefine" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M10 18h4v-2h-4v2Zm-7-6v2h18v-2H3ZM6 6v2h12V6H6Z"/>
            </svg>
            <span>Refine</span>
            <span class="m3e-chip__badge m3e-tabular" id="refineBadge" hidden>0</span>
          </button>
          <button class="m3e-chip m3e-state filterbar__chip" id="chipSort" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M3 6h12v2H3V6Zm0 5h9v2H3v-2Zm0 5h6v2H3v-2Zm15 2.6V10h2v8.6l2.3-2.3 1.4 1.4L19 22.1l-4.7-4.4 1.4-1.4 2.3 2.3Z"/>
            </svg>
            <span id="chipSortLabel">Newest</span>
          </button>
          <!-- Only shown while a shuffle is active: re-deals the order.
               Reaching into a menu for a repeated action is too slow. -->
          <button class="m3e-chip m3e-state filterbar__chip" id="chipShuffle" hidden aria-label="Shuffle again">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M17 4.5 21.5 9 17 13.5V10.4h-2.1c-1 0-1.6.4-2.4 1.6l-.6 1-1.4-2.3.4-.6C12 8.3 13.2 7.6 15 7.6H17V4.5ZM3 8h3.2c1.6 0 2.8.6 3.9 2.2l3 4.6c.7 1 1.2 1.3 2 1.3H17v-3.1L21.5 17 17 21.5v-3.1h-1.9c-1.7 0-2.9-.7-4-2.4l-3-4.6C7.4 10.3 6.9 10 6.2 10H3V8Zm0 8h3.2c.6 0 1-.2 1.5-.8l.4-.6 1.4 2.3-.2.3c-.9 1.2-1.9 1.8-3.1 1.8H3v-3Z"/>
            </svg>
            <span>Shuffle again</span>
          </button>
          <button class="m3e-chip m3e-state filterbar__chip filterbar__chip--reset" id="chipReset" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9Z"/>
            </svg>
            <span>Clear all</span>
          </button>
        </div>
      </div>

      <!-- Result summary, announced to assistive tech --------------------- -->
      <p class="m3e-body-medium pane__summary" id="resultSummary" role="status" aria-live="polite"></p>

      <!-- Every tile points its aria-describedby here. It lives in the shell
           rather than inside a view so the reference can never dangle when
           the view changes. -->
      <p id="tileHint" class="m3e-visually-hidden">
        Opens the full-size viewer. Press i to see the post it came from.
      </p>

      <!-- The feed. Its contents are entirely view-dependent: rails, grid or
           theater. One region, three renderers. -->
      <main class="feed" id="feed" tabindex="-1"></main>

      <div class="feed__more" id="loadMoreHost"></div>

      <footer class="pane__foot m3e-body-small">
        <span>All data lives in this browser. Nothing is uploaded.</span>
      </footer>
    </div>
  </div>

  <!-- ---------------------------------------------------------------------
       Inspector — persistent on expanded windows, a sheet below that.
       Deliberately NOT called "detail": it holds the post behind whatever
       media is selected, which is context, not the main event. The pane is
       collapsed entirely while nothing is selected — the feed keeps the room.
       --------------------------------------------------------------------- -->
  <aside class="shell__detail" id="detailPane" aria-label="Post details" aria-live="polite" data-open="false">
    <div class="detail" id="detailBody" hidden></div>
  </aside>
</div>

<!-- ==========================================================================
     Floating bottom bar — compact window class only.

     A docked navigation bar would eat 80px of a phone screen permanently, on
     a surface whose entire value is vertical room for media. This is M3
     Expressive's floating toolbar instead: it hides on scroll-down, returns
     on scroll-up, and is the destination switcher and the primary action in
     one 64px pill.
     ========================================================================== -->
<nav class="m3e-toolbar m3e-toolbar--floating nav-bar" id="navBar" aria-label="Primary"></nav>

<!-- ==========================================================================
     Overlays
     ========================================================================== -->
<div class="m3e-scrim" id="scrim" data-open="false"></div>

<!-- Adaptive sheet: bottom sheet on compact, side sheet from medium up -->
<div class="m3e-sheet m3e-sheet--bottom sheet" id="sheet" role="dialog" aria-modal="true"
  aria-labelledby="sheetTitle" aria-hidden="true" data-open="false">
  <div class="m3e-sheet__handle" aria-hidden="true"></div>
  <div class="m3e-sheet__header">
    <h2 class="m3e-title-large m3e-title-large--emphasized m3e-sheet__title" id="sheetTitle"></h2>
    <button class="m3e-icon-button m3e-state" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9Z"/>
      </svg>
    </button>
  </div>
  <div class="m3e-sheet__content" id="sheetContent"></div>
</div>

<!-- Settings / confirm dialog -->
<div class="m3e-dialog dialog" id="dialog" role="dialog" aria-modal="true"
  aria-labelledby="dialogTitle" aria-hidden="true" data-open="false">
  <div class="m3e-dialog__header">
    <h2 class="m3e-headline-small m3e-headline-small--emphasized m3e-dialog__title" id="dialogTitle"></h2>
    <button class="m3e-icon-button m3e-state" id="dialogClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9Z"/>
      </svg>
    </button>
  </div>
  <div class="m3e-dialog__content" id="dialogContent"></div>
  <div class="m3e-dialog__actions" id="dialogActions"></div>
</div>

<!-- Snackbar -->
<div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
  <span class="m3e-snackbar__text"></span>
  <button class="m3e-snackbar__action" hidden></button>
</div>

<!-- Hidden file inputs -->
<input type="file" id="fileImport" accept=".json,.jsonl,application/json" hidden />
<input type="file" id="fileRestore" accept=".json,application/json" hidden />

<script src="../shared/m3e/color.js"></script>
<script src="../shared/m3e/theme.js"></script>
<script src="../shared/m3e/interactions.js"></script>
<script src="../shared/m3e/media.js"></script>
<script src="bridge.js"></script>
<script src="lightbox.js"></script>
<script src="app.js"></script>
</body>
</html>
