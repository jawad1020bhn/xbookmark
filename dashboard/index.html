<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks — X Exporter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="shell">

  <!-- ========================================================
       App bar — 64px, surface, blur on scroll
       ======================================================== -->
  <header class="appbar" id="appbar" role="banner" data-theme="dark">
    <div class="appbar__inner">

      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M5 3h14a1 1 0 0 1 1 1v17l-8-4-8 4V4a1 1 0 0 1 1-1Z"/>
          </svg>
        </span>
        <div class="brand__text">
          <h1 class="brand__name">Bookmarks</h1>
          <span class="brand__sub" id="summary">0 bookmarks</span>
        </div>
      </div>

      <div class="searchbar" role="search">
        <svg class="searchbar__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 0 0 1.4-5.3A4.5 4.5 0 1 0 6 10.5a4.5 4.5 0 0 0 8.5 0 4.4 4.4 0 0 0-.9-3A5.8 5.8 0 0 0 15 7c.3 1.2.2 2.5-.2 3.6l.3.3h.8l5 5-1.5 1.5-5-5Z"/>
        </svg>
        <input id="search" class="searchbar__input" type="search"
          placeholder="Search text, author, tags…"
          aria-label="Search bookmarks" autocomplete="off" spellcheck="false" />
        <button id="searchClear" class="icon-btn searchbar__clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1L14 15.5l-2-2-2 2-1.5-1.4 2-2-2-2L8 8.5l2 2 2-2 1.5 1.4-2 2 2 2Z"/>
          </svg>
        </button>
        <kbd class="searchbar__kbd">/</kbd>
      </div>

      <div class="appbar__actions">
        <button id="importBtn" class="btn btn--tonal btn--compact">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M11 14.6V3h2v11.6l4.3-4.3 1.4 1.4L12 19l-6.7-6.3 1.4-1.4L11 14.6ZM4 20h16v2H4v-2Z"/>
          </svg>
          <span>Import</span>
        </button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle color theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 3a9 9 0 0 0 0 18 7 7 0 0 0 0-14 3 3 0 1 1 0-6 9 9 0 0 1 0 2Z"/>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Zm7.4-2.5c0-.3 0-.7-.1-1l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6c0 .3-.1.7-.1 1s0 .7.1 1l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1Z"/>
          </svg>
        </button>
        <button id="overflowBtn" class="icon-btn" aria-label="More actions" title="More actions">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================================
       Filter bar
       ======================================================== -->
  <nav class="filterbar" aria-label="Filter and sort">
    <div class="filterbar__inner">

      <!-- Segmented: Show Current / All / Archived -->
      <div class="segmented" id="showSeg" role="tablist" aria-label="Archive state">
        <span class="segmented__thumb" aria-hidden="true"></span>
        <button class="segmented__item" role="tab" aria-selected="true" data-show="active">Current</button>
        <button class="segmented__item" role="tab" aria-selected="false" data-show="all">All</button>
        <button class="segmented__item" role="tab" aria-selected="false" data-show="archived">Archived</button>
      </div>

      <!-- Author chip -->
      <button id="authorBtn" class="chip chip--tonal" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.3 0-6 1.7-6 5v1h12v-1c0-3.3-2.7-5-6-5Z"/>
        </svg>
        <span id="authorLabel">All authors</span>
      </button>

      <!-- Filters chip with badge -->
      <button id="filtersBtn" class="chip chip--tonal" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M3 6h18v2H3V6Zm3 5h12v2H6v-2Zm3 5h6v2H9v-2Z"/>
        </svg>
        <span>Filters</span>
        <span id="filterBadge" class="chip__badge" hidden>0</span>
      </button>

      <!-- Sort chip -->
      <button id="sortBtn" class="chip chip--tonal" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M3 6h11v2H3V6Zm0 5h8v2H3v-2Zm0 5h5v2H3v-2Zm15 2.6V11h-2v7.6l-2.3-2.3-1.4 1.4L17 22l4.7-4.3-1.4-1.4L18 18.6Z"/>
        </svg>
        <span id="sortLabel">Newest</span>
      </button>

      <!-- Views chip -->
      <button id="viewsBtn" class="chip chip--tonal" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="m12 17.3-6.2 3.7 1.6-7L2 9.2l7.2-.6L12 2l2.8 6.6 7.2.6-5.4 4.8 1.6 7-6.2-3.7Z"/>
        </svg>
        <span>Views</span>
      </button>

      <!-- Reset chip -->
      <button id="resetFilters" class="chip chip--text" hidden>Reset</button>

    </div>
  </nav>

  <!-- ========================================================
       Hero stat band
       ======================================================== -->
  <section class="hero" aria-label="Library summary">
    <div class="hero__main" data-hero-main>
      <span class="hero__overline overline">Your library</span>
      <div class="hero__count">
        <span id="heroCount">0</span>
        <span class="hero__unit">bookmarks</span>
      </div>
    </div>
    <div class="hero__stats">
      <div class="stat-pill stat-pill--total">
        <span class="stat-pill__num" id="heroShown">0</span>
        <span class="hero__cap">shown</span>
      </div>
      <div class="stat-pill stat-pill--archived">
        <span class="stat-pill__num" id="heroArchived">0</span>
        <span class="hero__cap">archived</span>
      </div>
    </div>
  </section>

  <!-- ========================================================
       Content area — bookmark list (chunked rendering)
       ======================================================== -->
  <main class="content" id="content">
    <div id="results" class="list" aria-live="polite"></div>
  </main>

</div>

<!-- ========================================================
   Floating import FAB
   ======================================================== -->
<button id="fabImport" class="fab" aria-label="Import bookmarks">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path fill="currentColor" d="M11 14.6V3h2v11.6l4.3-4.3 1.4 1.4L12 19l-6.7-6.3 1.4-1.4L11 14.6ZM4 20h16v2H4v-2Z"/>
  </svg>
  <span>Import</span>
</button>

<!-- ========================================================
   Detail drawer (desktop right panel / mobile bottom sheet)
   ======================================================== -->
<div id="detailScrim" class="scrim" hidden></div>
<aside id="detailPanel" class="detail" role="dialog" aria-modal="true"
  aria-label="Bookmark details" aria-hidden="true"></aside>

<!-- ========================================================
   Bottom sheet (filters, author, sort, views, overflow)
   ======================================================== -->
<div id="sheetScrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet__handle" aria-hidden="true"></div>
  <div class="sheet__header">
    <h2 id="sheetTitle" class="sheet__title"></h2>
    <button id="sheetClose" class="icon-btn" aria-label="Close sheet">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="currentColor" d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12Z"/>
      </svg>
    </button>
  </div>
  <div id="sheetContent" class="sheet__content"></div>
</div>

<!-- ========================================================
   Settings dialog
   ======================================================== -->
<div id="dialogScrim" class="scrim" hidden></div>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="dialog__content-wrap">
    <div class="dialog__header">
      <h2 id="dialogTitle" class="dialog__title"></h2>
      <button id="dialogClose" class="icon-btn" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12Z"/>
        </svg>
      </button>
    </div>
    <div id="dialogContent" class="dialog__content"></div>
  </div>
</div>

<!-- ========================================================
   Snackbar
   ======================================================== -->
<div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

<!-- ========================================================
   Hidden file inputs
   ======================================================== -->
<input type="file" id="import" accept=".json,.jsonl,application/json" hidden />
<input type="file" id="restore" accept=".json,application/json" hidden />

<script src="app.js"></script>
</body>
</html>
