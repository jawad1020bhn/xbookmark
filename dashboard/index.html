<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Library · X Bookmarks</title>
  <link rel="stylesheet" href="../shared/m3e/fonts.css" />
  <link rel="stylesheet" href="../shared/m3e/tokens.css" />
  <link rel="stylesheet" href="../shared/m3e/components.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ui-enhancements.css" />
  <link rel="stylesheet" href="product-redesign.css" />
</head>
<body>
  <a class="skip" href="#stage">Skip to media</a>

  <header class="appbar" id="appbar">
    <div class="appbar__brand">
      <span class="appbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 5h16v3H4V5Zm0 5.5h16V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8.5Zm3 3v5h10v-5H7Z"/></svg>
      </span>
      <div>
        <p class="m3e-title-medium m3e-title-medium--emphasized">Library</p>
        <p class="m3e-label-small appbar__count"><span id="resultCount">0</span> items</p>
      </div>
    </div>

    <label class="search">
      <span class="visually-hidden">Search media, authors, captions and alt text</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
      <input id="search" type="search" placeholder="Search media, authors, captions…" autocomplete="off" />
      <kbd aria-hidden="true">/</kbd>
    </label>

    <div class="appbar__tools">
      <div class="views" role="group" aria-label="Library mode">
        <button type="button" class="mode-tab m3e-state" data-view="rails" aria-pressed="true"><span aria-hidden="true">✦</span>Discover</button>
        <button type="button" class="mode-tab m3e-state" data-view="grid"><span aria-hidden="true">▦</span>Library</button>
        <button type="button" class="mode-tab m3e-state" data-view="reels"><span aria-hidden="true">▶</span>Watch</button>
      </div>
      <button type="button" class="command-button m3e-state" id="sortBtn">
        <span id="sortLabel">Sort · Newest</span>
      </button>
      <button type="button" class="command-button m3e-state" id="filterBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M10 18h4v-2h-4v2ZM3 6v2h18V6H3Zm3 7h12v-2H6v2Z"/></svg>
        <span id="filterLabel">Filter</span>
      </button>
      <span class="appbar__divider" aria-hidden="true"></span>
      <button type="button" class="m3e-icon-button m3e-state" id="moreBtn" aria-label="Library menu" title="Library menu">•••</button>
    </div>
  </header>

  <div class="chiprow">
    <div id="chips" class="chips"></div>
    <button type="button" class="m3e-button m3e-button--text m3e-button--xs m3e-state" id="clearFilters" hidden>Clear all</button>
    <button type="button" class="capture-pill" id="capturePill" hidden><span>Capture idle</span></button>
  </div>

  <main id="stage" class="stage" tabindex="-1"></main>

  <!-- Immersive viewer -->
  <div id="viewer" class="viewer" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Media viewer">
    <div class="viewer__bar">
      <button type="button" class="viewer__back m3e-button m3e-button--text m3e-state" id="viewerClose" aria-label="Back to library">← <span>Back to Library</span></button>
      <span class="m3e-label-large" id="viewerPos">1 / 1</span>
      <div class="viewer__tools">
        <button type="button" class="viewer__help m3e-icon-button m3e-state" id="viewerHelp" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
        <button type="button" class="m3e-button m3e-button--text m3e-state" id="ctxToggle">Details</button>
      </div>
    </div>
    <div class="viewer__body">
      <button type="button" class="viewer__nav viewer__nav--prev m3e-icon-button m3e-state" id="viewerPrev" aria-label="Previous">‹</button>
      <div class="viewer__stage" id="viewerStage"></div>
      <button type="button" class="viewer__nav viewer__nav--next m3e-icon-button m3e-state" id="viewerNext" aria-label="Next">›</button>
      <aside class="viewer__context" id="viewerContext"></aside>
    </div>
    <div class="viewer__summary" id="viewerSummary"></div>
  </div>

  <!-- Filter sheet -->
  <div class="m3e-scrim" id="filterScrim" data-open="false"></div>
  <aside id="filterSheet" class="sheet" hidden>
    <header class="sheet__head">
      <h2 class="m3e-title-large">Filters</h2>
      <button type="button" class="m3e-icon-button m3e-state" id="filterClose" aria-label="Close filters">×</button>
    </header>
    <div id="filterBody" class="sheet__body"></div>
  </aside>

  <!-- Settings -->
  <div class="m3e-scrim" id="scrim" data-open="false"></div>
  <div class="m3e-dialog" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="settingsTitle">Settings</h2>
    </div>
    <div class="m3e-dialog__content" id="settingsBody"></div>
  </div>

  <div class="m3e-dialog" id="dataDialog" role="dialog" aria-modal="true" aria-labelledby="dataTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="dataTitle">Data &amp; storage</h2>
    </div>
    <div class="m3e-dialog__content" id="dataBody"></div>
  </div>

  <div class="bulkbar" id="bulkbar" hidden role="toolbar" aria-label="Selected media actions">
    <strong><span id="selectedCount">0</span> selected</strong>
    <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="seen">Mark seen</button>
    <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="archive">Archive</button>
    <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="export">Export</button>
    <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="delete">Delete</button>
    <button type="button" class="m3e-icon-button m3e-state" data-bulk="cancel" aria-label="Cancel selection">×</button>
  </div>

  <div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
    <span class="m3e-snackbar__text"></span>
    <button class="m3e-snackbar__action" hidden></button>
  </div>
  <div class="visually-hidden" id="resultAnnouncement" aria-live="polite" aria-atomic="true"></div>

  <input type="file" id="importFile" accept=".json,.jsonl,application/json" hidden />

  <script src="../shared/m3e/color.js"></script>
  <script src="../shared/m3e/theme.js"></script>
  <script src="../shared/m3e/interactions.js"></script>
  <script src="../shared/m3e/media.js"></script>
  <script src="../shared/m3e/video-controls.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
