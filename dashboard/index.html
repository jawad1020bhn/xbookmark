<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1D1B20" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235B4CF5'/%3E%3Cpath d='M6 7.5h12v2H6v-2Zm0 4h12v5.5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-5.5Z' fill='white'/%3E%3C/svg%3E" />
  <title>Library · X Bookmarks</title>
  <!-- ?v= busts the browser cache when assets change (extension reloads and
       local previews otherwise serve stale CSS/JS from cache). -->
  <link rel="stylesheet" href="m3e/fonts.css?v=4" />
  <link rel="stylesheet" href="m3e/tokens.css?v=4" />
  <link rel="stylesheet" href="m3e/components.css?v=4" />
  <link rel="stylesheet" href="dashboard.css?v=4" />
</head>
<body data-view="rails">
  <a class="skip" href="#stage">Skip to media</a>

  <header class="appbar" id="appbar">
    <div class="appbar__brand">
      <span class="appbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 5h16v3H4V5Zm0 5.5h16V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8.5Zm3 3v5h10v-5H7Z"/></svg>
      </span>
      <div>
        <p class="m3e-title-medium m3e-title-medium--emphasized appbar__title">Library</p>
        <p class="m3e-label-small appbar__count"><span id="resultCount">0</span> items</p>
      </div>
    </div>

    <div class="search-wrap" id="searchWrap">
      <label class="search" id="searchLabel">
        <span class="visually-hidden">Search media, authors, captions and alt text</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
        <input id="search" type="search" placeholder="Search your library…" autocomplete="off" spellcheck="false" />
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="search-panel" id="searchPanel" hidden>
        <div class="search-panel__hint" id="searchHint">Search across media, captions, authors and alt text</div>
        <div class="search-panel__section" id="searchRecent" hidden>
          <p class="m3e-label-small search-panel__label">Recent</p>
          <div class="search-panel__chips" id="searchRecentChips"></div>
        </div>
        <div class="search-panel__section" id="searchQuick">
          <p class="m3e-label-small search-panel__label">Quick filters</p>
          <div class="search-panel__chips">
            <button type="button" class="m3e-chip m3e-state" data-quick="kind:video">Videos</button>
            <button type="button" class="m3e-chip m3e-state" data-quick="seen:unseen">Unseen</button>
            <button type="button" class="m3e-chip m3e-state" data-quick="progress:yes">In progress</button>
            <button type="button" class="m3e-chip m3e-state" data-quick="author">From creator</button>
          </div>
        </div>
        <div class="search-panel__footer">
          <span id="searchResultCount" class="m3e-label-small"></span>
          <span class="m3e-label-small search-panel__tip">Press <kbd>/</kbd> to focus · <kbd>Esc</kbd> to clear</span>
        </div>
      </div>
    </div>

    <div class="appbar__tools">
      <div class="views" role="group" aria-label="Library mode">
        <button type="button" class="mode-tab m3e-state" data-view="rails" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/></svg>
          <span class="mode-tab__label">Discover</span>
        </button>
        <button type="button" class="mode-tab m3e-state" data-view="grid">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span class="mode-tab__label">Library</span>
        </button>
        <button type="button" class="mode-tab m3e-state" data-view="reels">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/><path d="M3 9h18"/></svg>
          <span class="mode-tab__label">Watch</span>
        </button>
      </div>
      <button type="button" class="command-button m3e-state" id="sortBtn">
        <span id="sortLabel">Sort · Newest</span>
      </button>
      <button type="button" class="command-button m3e-state" id="filterBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M10 18h4v-2h-4v2ZM3 6v2h18V6H3Zm3 7h12v-2H6v2Z"/></svg>
        <span id="filterLabel">Filter</span>
      </button>
      <span class="appbar__divider" aria-hidden="true"></span>
      <button type="button" class="m3e-icon-button m3e-state" id="moreBtn" aria-label="Library menu" title="Library menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
      </button>
    </div>
  </header>

  <div class="chiprow">
    <div id="chips" class="chips"></div>
    <button type="button" class="m3e-button m3e-button--text m3e-button--xs m3e-state" id="clearFilters" hidden>Clear all</button>
    <button type="button" class="capture-pill" id="capturePill" hidden><span>Capture idle</span></button>
  </div>

  <main id="stage" class="stage" tabindex="-1"></main>

  <!-- Immersive viewer -->
  <div id="viewer" class="viewer" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Media viewer">
    <div class="viewer__bar" id="viewerBar">
      <button type="button" class="viewer__back m3e-button m3e-button--text m3e-state" id="viewerClose" aria-label="Back to library">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Back to Library</span>
      </button>
      <span class="m3e-label-large viewer__pos" id="viewerPos">1 / 1</span>
      <div class="viewer__tools">
        <button type="button" class="m3e-icon-button m3e-state viewer__icon" id="viewerFilmstripBtn" aria-label="Toggle filmstrip" title="Filmstrip (F)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M9 4v16M15 4v16"/></svg>
        </button>
        <button type="button" class="m3e-icon-button m3e-state viewer__icon" id="viewerFocusBtn" aria-label="Focus mode" title="Focus mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
        <button type="button" class="viewer__help m3e-icon-button m3e-state" id="viewerHelp" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
        <button type="button" class="m3e-button m3e-button--text m3e-state" id="ctxToggle">Details</button>
      </div>
    </div>
    <div class="viewer__body">
      <button type="button" class="viewer__nav viewer__nav--prev m3e-icon-button m3e-state" id="viewerPrev" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6L9 12l5.5 6"/></svg>
      </button>
      <div class="viewer__stage" id="viewerStage"></div>
      <button type="button" class="viewer__nav viewer__nav--next m3e-icon-button m3e-state" id="viewerNext" aria-label="Next">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6L15 12l-5.5 6"/></svg>
      </button>
      <aside class="viewer__context" id="viewerContext"></aside>
    </div>
    <div class="viewer__summary" id="viewerSummary"></div>
    <div class="viewer__filmstrip" id="viewerFilmstrip" hidden></div>
    <div class="viewer__peek viewer__peek--prev" id="viewerPeekPrev" aria-hidden="true"></div>
    <div class="viewer__peek viewer__peek--next" id="viewerPeekNext" aria-hidden="true"></div>
  </div>

  <!-- Filter sheet -->
  <div class="m3e-scrim" id="filterScrim" data-open="false"></div>
  <aside id="filterSheet" class="sheet" hidden>
    <header class="sheet__head">
      <h2 class="m3e-title-large">Filters</h2>
      <button type="button" class="m3e-icon-button m3e-state" id="filterClose" aria-label="Close filters">×</button>
    </header>
    <div id="filterBody" class="sheet__body"></div>
  </aside>

  <!-- Settings -->
  <div class="m3e-scrim" id="scrim" data-open="false"></div>
  <div class="m3e-dialog" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="settingsTitle">Settings</h2>
    </div>
    <div class="m3e-dialog__content" id="settingsBody"></div>
  </div>

  <div class="m3e-dialog" id="dataDialog" role="dialog" aria-modal="true" aria-labelledby="dataTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="dataTitle">Data &amp; storage</h2>
    </div>
    <div class="m3e-dialog__content" id="dataBody"></div>
  </div>

  <!-- Confirm dialog (replaces native confirm()) -->
  <div class="m3e-scrim" id="confirmScrim" data-open="false"></div>
  <div class="m3e-dialog m3e-dialog--compact" id="confirmDialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="confirmTitle">Are you sure?</h2>
    </div>
    <div class="m3e-dialog__content"><p class="m3e-body-medium" id="confirmBody"></p></div>
    <div class="m3e-dialog__actions">
      <button type="button" class="m3e-button m3e-button--text m3e-state" id="confirmCancel">Cancel</button>
      <button type="button" class="m3e-button m3e-button--filled m3e-state" id="confirmOk">Confirm</button>
    </div>
  </div>

  <!-- Name dialog (replaces native prompt()) -->
  <div class="m3e-scrim" id="promptScrim" data-open="false"></div>
  <div class="m3e-dialog m3e-dialog--compact" id="promptDialog" role="dialog" aria-modal="true" aria-labelledby="promptTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="promptTitle">Name this view</h2>
    </div>
    <div class="m3e-dialog__content">
      <p class="m3e-body-medium m3e-dialog__hint" id="promptBody"></p>
      <label class="field" for="promptInput">View name</label>
      <input id="promptInput" class="prompt-input" type="text" spellcheck="false" maxlength="60" autocomplete="off" />
    </div>
    <div class="m3e-dialog__actions">
      <button type="button" class="m3e-button m3e-button--text m3e-state" id="promptCancel">Cancel</button>
      <button type="button" class="m3e-button m3e-button--filled m3e-state" id="promptOk">Save view</button>
    </div>
  </div>

  <!-- Saved views dialog -->
  <div class="m3e-dialog" id="savedViewsDialog" role="dialog" aria-modal="true" aria-labelledby="savedViewsTitle" data-open="false" aria-hidden="true">
    <div class="m3e-dialog__header">
      <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="savedViewsTitle">Saved views</h2>
      <button type="button" class="m3e-icon-button m3e-state" id="savedViewsClose" aria-label="Close">×</button>
    </div>
    <div class="m3e-dialog__content" id="savedViewsBody"></div>
  </div>

  <div class="bulkbar" id="bulkbar" hidden role="toolbar" aria-label="Selected media actions">
    <div class="bulkbar__count"><strong><span id="selectedCount">0</span> selected</strong></div>
    <div class="bulkbar__group" data-bulk-group="common">
      <button type="button" class="m3e-button m3e-button--tonal m3e-state" data-bulk="archive">Archive</button>
      <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="seen">Mark seen</button>
      <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="unseen">Mark unseen</button>
    </div>
    <span class="bulkbar__sep" aria-hidden="true"></span>
    <div class="bulkbar__group" data-bulk-group="share">
      <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="copy">Copy links</button>
      <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="open">Open originals</button>
      <button type="button" class="m3e-button m3e-button--text m3e-state" data-bulk="export">Export</button>
    </div>
    <span class="bulkbar__sep" aria-hidden="true"></span>
    <div class="bulkbar__group" data-bulk-group="danger">
      <button type="button" class="m3e-button m3e-button--text bulkbar__danger m3e-state" data-bulk="delete">Remove</button>
    </div>
    <button type="button" class="m3e-icon-button m3e-state bulkbar__close" data-bulk="cancel" aria-label="Cancel selection">×</button>
  </div>

  <div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
    <span class="m3e-snackbar__text"></span>
    <button class="m3e-snackbar__action" hidden></button>
  </div>
  <div class="visually-hidden" id="resultAnnouncement" aria-live="polite" aria-atomic="true"></div>

  <input type="file" id="importFile" accept=".json,.jsonl,application/json" hidden />

  <script src="m3e/color.js?v=4"></script>
  <script src="m3e/theme.js?v=4"></script>
  <script src="m3e/interactions.js?v=4"></script>
  <script src="m3e/media.js?v=4"></script>
  <script src="m3e/video-controls.js?v=4"></script>
  <script src="js/demo.js?v=4"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/library.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
