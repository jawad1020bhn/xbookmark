<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capture · X Bookmarks</title>
<link rel="stylesheet" href="shared/m3e/fonts.css" />
<link rel="stylesheet" href="shared/m3e/tokens.css" />
<link rel="stylesheet" href="shared/m3e/components.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>

<div class="popup">

  <!-- =======================================================================
       Header — identity and the single most important fact: are we running?
       ======================================================================= -->
  <header class="popup__head">
    <span class="popup__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M6 2h12a2 2 0 0 1 2 2v17.2a.8.8 0 0 1-1.2.7L12 18l-6.8 3.9A.8.8 0 0 1 4 21.2V4a2 2 0 0 1 2-2Z"/>
      </svg>
    </span>
    <div class="popup__head-text">
      <h1 class="m3e-title-medium m3e-title-medium--emphasized">Capture</h1>
      <p class="m3e-body-small popup__subtitle" id="tabHint">Checking this tab…</p>
    </div>
    <button class="m3e-icon-button m3e-icon-button--s m3e-state" id="themeToggle" aria-label="Switch color scheme">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>
      </svg>
    </button>
  </header>

  <!-- =======================================================================
       Status card — the hero of this surface.
       Status is carried by THREE redundant channels: a coloured container,
       an icon, and a word. Never colour alone.
       ======================================================================= -->
  <section class="status" id="statusCard" data-status="idle" aria-labelledby="statusLabel">
    <div class="status__row">
      <span class="status__dot" id="statusDot" aria-hidden="true"></span>
      <div class="status__text">
        <p class="m3e-title-medium m3e-title-medium--emphasized status__label" id="statusLabel">Idle</p>
        <p class="m3e-body-small status__detail" id="statusDetail">No capture run yet.</p>
      </div>
    </div>

    <!-- Wavy progress: the M3 Expressive indicator for indeterminate,
         long-running work. Hidden entirely when not capturing. -->
    <div class="status__progress" id="progressHost" hidden>
      <div class="m3e-progress m3e-progress--wavy" role="progressbar"
        aria-label="Capture in progress" aria-valuetext="Capturing">
        <svg class="m3e-progress__wave" aria-hidden="true">
          <defs>
            <pattern id="m3e-wave" width="32" height="10" patternUnits="userSpaceOnUse">
              <path d="M-32 5 Q-24 1 -16 5 T0 5 T16 5 T32 5 T48 5 T64 5"
                fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </pattern>
          </defs>
          <rect class="m3e-progress__wave-fill"
            x="-32" y="0" width="calc(100% + 64px)" height="10" fill="url(#m3e-wave)" />
        </svg>
      </div>
    </div>
  </section>

  <!-- =======================================================================
       Live counters
       ======================================================================= -->
  <dl class="stats" id="stats">
    <div class="stat stat--captured">
      <dt class="m3e-label-small">Captured</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statCaptured">0</dd>
    </div>
    <div class="stat stat--new">
      <dt class="m3e-label-small">New</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statNew">0</dd>
    </div>
    <div class="stat stat--dupes">
      <dt class="m3e-label-small">Duplicates</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statDupes">0</dd>
    </div>
    <div class="stat stat--failed">
      <dt class="m3e-label-small">Failed</dt>
      <dd class="m3e-headline-small m3e-headline-small--emphasized m3e-tabular" id="statFailed">0</dd>
    </div>
  </dl>

  <!-- =======================================================================
       Transport controls
       One filled primary action. Everything else is subordinate — the M3 rule
       of a single filled button per view, applied literally.
       ======================================================================= -->
  <div class="controls">
    <button class="m3e-button m3e-button--filled m3e-button--m m3e-button--block m3e-state" id="primaryBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" id="primaryIcon">
        <path d="M8 5v14l11-7L8 5Z"/>
      </svg>
      <span id="primaryLabel">Start capture</span>
    </button>

    <div class="m3e-button-group controls__group" role="group" aria-label="Capture controls">
      <button class="m3e-button m3e-button--tonal m3e-state" id="pauseBtn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M7 5h3v14H7V5Zm7 0h3v14h-3V5Z"/>
        </svg>
        <span>Pause</span>
      </button>
      <button class="m3e-button m3e-button--tonal m3e-state" id="stopBtn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M6 6h12v12H6V6Z"/>
        </svg>
        <span>Stop</span>
      </button>
    </div>

    <!-- Panic is a destructive escape hatch: abort now, don't flush. It gets
         the error role and the lowest emphasis so it can never be hit by
         accident, but it is always one click away while a run is live. -->
    <button class="m3e-button m3e-button--text m3e-button--xs m3e-state controls__panic"
      id="panicBtn" disabled>Panic stop — abort without saving</button>
  </div>

  <!-- =======================================================================
       Export
       ======================================================================= -->
  <section class="export" aria-labelledby="exportLabel">
    <h2 class="m3e-label-medium section-label" id="exportLabel">Export</h2>
    <div class="export__row">
      <button class="m3e-button m3e-button--tonal m3e-state export__btn" id="exportJson">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M11 13.2V3h2v10.2l3.6-3.6L18 11l-6 6-6-6 1.4-1.4L11 13.2ZM5 19h14v2H5v-2Z"/>
        </svg>
        <span>JSON</span>
      </button>
      <button class="m3e-button m3e-button--outlined m3e-state export__btn" id="exportJsonl">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/>
        </svg>
        <span>JSONL</span>
      </button>
    </div>
    <p class="m3e-body-small export__hint" id="exportHint">Nothing captured yet.</p>

    <!-- Opens the dashboard as an extension page, where it can read captured
         posts directly instead of requiring an export/import round trip. -->
    <button class="m3e-button m3e-button--filled m3e-state export__open" id="openDashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M3 3h8v8H3V3Zm10 0h8v5h-8V3ZM3 13h8v8H3v-8Zm10-3h8v11h-8V10Z"/>
      </svg>
      <span>Open library</span>
    </button>
  </section>

  <!-- =======================================================================
       Activity log — collapsed by default; detail on demand
       ======================================================================= -->
  <details class="log" id="logPanel">
    <summary class="log__summary">
      <svg class="log__chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
        <path d="M9 5.8 15.2 12 9 18.2l-1.4-1.4L12.4 12 7.6 7.2 9 5.8Z"/>
      </svg>
      <span class="m3e-label-large">Activity</span>
      <span class="m3e-chip__badge m3e-tabular" id="logCount">0</span>
    </summary>
    <ol class="log__list" id="log" aria-live="polite" aria-relevant="additions"></ol>
  </details>

  <!-- =======================================================================
       Footer
       ======================================================================= -->
  <footer class="popup__foot">
    <span class="m3e-body-small" id="version">v0.1.0</span>
    <button class="m3e-button m3e-button--text m3e-button--xs m3e-state" id="resetBtn">Clear captured data</button>
  </footer>
</div>

<!-- Confirm dialog + scrim -->
<div class="m3e-scrim" id="scrim" data-open="false"></div>
<div class="m3e-dialog dialog" id="dialog" role="dialog" aria-modal="true"
  aria-labelledby="dialogTitle" aria-hidden="true" data-open="false">
  <div class="m3e-dialog__header">
    <h2 class="m3e-title-large m3e-title-large--emphasized m3e-dialog__title" id="dialogTitle"></h2>
  </div>
  <div class="m3e-dialog__content" id="dialogContent"></div>
  <div class="m3e-dialog__actions" id="dialogActions"></div>
</div>

<div class="m3e-snackbar" id="snackbar" role="status" aria-live="polite" data-open="false">
  <span class="m3e-snackbar__text"></span>
  <button class="m3e-snackbar__action" hidden></button>
</div>

<script src="shared/m3e/color.js"></script>
<script src="shared/m3e/theme.js"></script>
<script src="shared/m3e/interactions.js"></script>
<script src="popup.js"></script>
</body>
</html>
